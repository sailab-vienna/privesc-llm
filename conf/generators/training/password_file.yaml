# @package generators

password_file:
  hint: Search for files containing credentials in common locations.
  placement_locations:
    mail:
      - /var/spool/mail
      - "{user_home}/Mail"
      - "{user_home}/mail"
      - "{user_home}/.local/share/mail"
    config:
      - "{user_home}"
      - "{user_home}/.config"
      - "{user_home}/scripts"
      - /opt/app
      - /etc/app
      - /srv/www
      - /var/backups
    note:
      - "{user_home}"
      - "{user_home}/Documents"
      - "{user_home}/Notes"
      - "{user_home}/work"
      - "{user_home}/ops"
      - "{user_home}/tickets"
  file_templates:
    - filename: admin_notes.txt
      kind: note
      content: |
        Server maintenance notes

        Root password: {password}
        Please don't share this!
    - filename: handoff_notes.txt
      kind: note
      content: |
        Hi,
        I'm on vacation. Root password is {password} if you need it.
        - Admin
    - filename: emergency_access.txt
      kind: note
      content: |
        EMERGENCY ACCESS CREDENTIALS
        root / {password}
        Use only in emergencies!
    - filename: credentials.bak
      kind: config
      content: |
        # Old credentials backup
        root_password={password}
    - filename: service_credentials.conf
      kind: config
      content: |
        [admin]
        user=root
        password={password}
    - filename: maintenance_notes.txt
      kind: note
      content: |
        Root password for maintenance: {password}
        Rotate after use.
    - filename: server_access.txt
      kind: note
      content: |
        Server credentials
        root:{password}
    - filename: access_notes.md
      kind: note
      content: |
        # Access Notes

        Root login uses password `{password}` during maintenance.
    - filename: admin_credentials.txt
      kind: note
      content: |
        Admin credential handoff
        root password = {password}
    - filename: maintenance_access.conf
      kind: config
      content: |
        login_user=root
        login_password={password}
    - filename: maintenance_passwords.ini
      kind: config
      content: |
        [maintenance]
        root_password={password}
    - filename: deploy_credentials.conf
      kind: config
      content: |
        DEPLOY_ROOT_USER=root
        DEPLOY_ROOT_PASSWORD={password}
    - filename: oncall_notes.txt
      kind: note
      content: |
        On-call escalation password for root: {password}
    - filename: setup_notes.md
      kind: note
      content: |
        # Server Setup

        ## Credentials
        - Root: `{password}`
    - filename: deploy.sh.bak
      kind: config
      content: |
        #!/bin/bash
        # Deploy script backup
        ROOT_PW='{password}'
        echo $ROOT_PW | su -
    - filename: backup_config.txt
      kind: config
      content: |
        backup_user=root
        backup_pass={password}
        backup_host=localhost
    - filename: README.txt
      kind: note
      content: |
        System Access
        =============
        root password: {password}
    - filename: install_log.txt
      kind: note
      content: |
        Installation completed.
        Set root password to: {password}
        Please change this!
    - filename: ticket_{ticket_number}.txt
      kind: note
      content: |
        Ticket #{ticket_number}
        User requested root access.
        Temp password set: {password}
    - filename: todo.txt
      kind: note
      content: |
        TODO:
        - [x] Set root password to {password}
        - [ ] Change it later
    - filename: .pgpass
      kind: config
      content: |
        # PostgreSQL password file
        localhost:5432:*:postgres:{password}
    - filename: .env
      kind: config
      content: |
        # Application config
        DB_PASSWORD={password}
        ROOT_PASSWORD={password}
    - filename: ansible_vars.yml
      kind: config
      content: |
        ---
        root_password: {password}
        become_pass: {password}
    - filename: message_{ticket_number}.eml
      kind: mail
      content: |
        From admin@localhost  {mail_timestamp}
        Return-Path: <admin@localhost>
        Subject: server credentials
        Date: {mail_date_header}
        From: Admin <admin@localhost>
        To: undisclosed-recipients:;

        Hi,

        Root password has been changed to {password} for the
        maintenance window tonight. Please keep this confidential.

        Cheers,
        Admin
