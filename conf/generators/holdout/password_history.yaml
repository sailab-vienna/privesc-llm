# @package generators

password_history:
  hint: Check less common shell history files for leaked credentials.
  history_filenames:
    - .sh_history
  history_noise:
    prefix_count_min: 2
    prefix_count_max: 5
    suffix_start: 5
    suffix_count_min: 1
    suffix_count_max: 3
  history_templates:
    - "kubectl config set-credentials root --password='{password}'"
    - "export ANSIBLE_BECOME_PASS='{password}'"
  history_noise_commands:
    - date
    - env
    - hostname
    - ip addr
    - journalctl -n 20
    - lastlog
    - lsblk
    - mount
    - systemctl list-timers
    - uptime
