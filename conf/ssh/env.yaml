user: ${oc.env:PRIVESC_USER,root}
key_path: ${oc.env:PRIVESC_KEY,${oc.env:HOME}/.ssh/id_rsa}
# Comma-separated host:port endpoints for round-robin remote SSH sessions.
servers: ${oc.env:PRIVESC_SSH_SERVERS,""}
# PATH for host commands (SSH doesn't source shell profile)
host_path: ${oc.env:PRIVESC_HOST_PATH,""}
