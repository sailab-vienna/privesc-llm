# @package generators

weak_password:
  patterns:
    - name: root_common_password
      target_role: root
      password_source: common_password
    - name: uid0_username_password
      target_role: uid0
      password_source: target_username
  uid0_users:
    - admin
    - monitoring
    - nagios
    - deploy
    - support
    - opsmaint
    - operator
    - sysadmin
  decoy_count_min: 1
  decoy_count_max: 2
  decoy_users:
    - backup
    - build
    - deploy
    - git
    - metrics
    - reporting
    - sync
  common_passwords:
    - password
    - password123
    - "123456"
    - admin
    - toor
    - debian
    - P@ssw0rd
    - changeme
