# @package generators

password_history:
  hint: Check shell history files for leaked credentials.
  history_filenames:
    - .bash_history
    - .zsh_history
  history_noise:
    prefix_count_min: 2
    prefix_count_max: 5
    suffix_start: 5
    suffix_count_min: 1
    suffix_count_max: 3
  history_templates:
    - "mysql -u root -p'{password}' -e 'SHOW DATABASES'"
    - "mysqldump -u root -p'{password}' --all-databases > backup.sql"
    - "psql postgresql://root:{password}@localhost/postgres -c '\\l'"
    - "echo 'root:{password}' | chpasswd"
    - "echo 'root:{password}' | sudo chpasswd"
    - "usermod -p $(openssl passwd -1 '{password}') root"
    - "curl -u root:{password} http://localhost:8080/admin"
    - "wget --http-user=root --http-password={password} http://localhost/backup.tar"
    - "ansible-playbook -e 'ansible_become_pass={password}' site.yml"
    - "ansible all -m shell -a 'whoami' --become --extra-vars 'ansible_become_password={password}'"
    - "expect -c 'spawn su -; expect \"Password:\"; send \"{password}\\r\"; interact'"
    - "openssl pkcs12 -export -password pass:{password} -in cert.pem -out cert.p12"
    - "docker login -u root -p {password} registry.local"
    - "passwd root <<< $'{password}\\n{password}'"
  history_noise_commands:
    - ls -la
    - cd /var/log
    - cat /etc/passwd
    - whoami
    - id
    - ps aux
    - df -h
    - free -m
    - uname -a
    - pwd
